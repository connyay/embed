# Fly.io Deployment Configuration for TEI Servers
# Each app deploys a text embeddings inference server with a specific model
# Models are downloaded at runtime and cached on a Fly volume

# Default settings applied to all apps
defaults:
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
  primary_region: ord
  vm_size: shared-cpu-2x
  memory: 2048
  min_machines: 0
  max_machines: 1
  auto_stop: suspend
  auto_start: true
  internal_port: 80
  volume_size: 1

apps:
  embed-bge-small:
    model_id: BAAI/bge-small-en-v1.5
    description: BAAI BGE Small English v1.5
    memory: 1536

  embed-bge-base:
    model_id: BAAI/bge-base-en-v1.5
    description: BAAI BGE Base English v1.5

  embed-bge-large:
    model_id: BAAI/bge-large-en-v1.5
    description: BAAI BGE Large English v1.5
    vm_size: shared-cpu-4x
    memory: 5120
    volume_size: 2

  embed-bge-m3:
    model_id: BAAI/bge-m3
    description: BAAI BGE M3 Multilingual
    extra_args: "--max-batch-tokens 4096 --auto-truncate"
    vm_size: shared-cpu-4x
    memory: 5120
    volume_size: 3

