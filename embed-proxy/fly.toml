app = "embed-proxy"
primary_region = "ord"

[build]

[env]
  RUST_LOG = "embed_proxy=info"
  EMBED_BASE_DOMAIN = "flycast"
  REQUEST_TIMEOUT_SECS = "300"
  CONNECT_TIMEOUT_SECS = "10"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
